<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin // Enterprise E-commerce</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
</head>
<body>

<!-- LOGIN GATE -->
<div id="loginGate" class="d-flex align-items-center justify-content-center" style="min-height:100vh;">
  <div class="bg-elevated border-terminal rounded p-4" style="width:360px;">
    <h4 class="mono text-gold mb-3">&gt;_ ADMIN LOGIN</h4>
    <input class="form-control mb-2" type="email" id="adminEmail" placeholder="Email">
    <input class="form-control mb-2" type="password" id="adminPassword" placeholder="Password">
    <div id="adminLoginError" class="text-danger small mb-2"></div>
    <button class="btn btn-gold w-100 mb-2" onclick="Admin.login()">Log In</button>
    <hr class="border-terminal">
    <p class="small text-dim mb-1">First time setup: promote your account to admin using the server's ADMIN_KEY.</p>
    <input class="form-control form-control-sm mb-2" id="bootstrapKey" placeholder="Admin key">
    <input class="form-control form-control-sm mb-2" id="bootstrapEmail" placeholder="Your registered email">
    <button class="btn btn-outline-cyan btn-sm w-100" onclick="Admin.bootstrap()">Promote to Admin</button>
    <div id="bootstrapMsg" class="small mt-2"></div>
  </div>
</div>

<!-- ADMIN APP -->
<div id="adminApp" style="display:none;">
  <nav class="navbar navbar-expand-lg navbar-terminal sticky-top">
    <div class="container-fluid">
      <a class="navbar-brand brand-gold mono" href="/admin">&gt;_ ADMIN PANEL</a>
      <ul class="navbar-nav flex-row gap-3 mono small">
        <li class="nav-item"><a class="nav-link" href="#" onclick="Admin.show('dashboard')">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="#" onclick="Admin.show('products')">Products</a></li>
        <li class="nav-item"><a class="nav-link" href="#" onclick="Admin.show('categories')">Categories</a></li>
        <li class="nav-item"><a class="nav-link" href="#" onclick="Admin.show('coupons')">Coupons</a></li>
        <li class="nav-item"><a class="nav-link" href="#" onclick="Admin.show('orders')">Orders</a></li>
        <li class="nav-item"><a class="nav-link" href="#" onclick="Admin.show('reviews')">Reviews</a></li>
        <li class="nav-item"><a class="nav-link" href="#" onclick="Admin.show('analytics')">Analytics</a></li>
        <li class="nav-item ms-auto"><a class="nav-link" href="/">← Storefront</a></li>
      </ul>
    </div>
  </nav>

  <div class="container-fluid py-4">
    <div id="panel-dashboard" class="admin-panel"></div>
    <div id="panel-products" class="admin-panel" style="display:none;"></div>
    <div id="panel-categories" class="admin-panel" style="display:none;"></div>
    <div id="panel-coupons" class="admin-panel" style="display:none;"></div>
    <div id="panel-orders" class="admin-panel" style="display:none;"></div>
    <div id="panel-reviews" class="admin-panel" style="display:none;"></div>
    <div id="panel-analytics" class="admin-panel" style="display:none;"></div>
  </div>
</div>

<!-- PRODUCT FORM MODAL -->
<div class="modal fade" id="productFormModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header border-terminal">
        <h5 class="modal-title mono text-gold">PRODUCT</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="pf_id">
        <div class="row g-2">
          <div class="col-md-6"><input class="form-control mb-2" id="pf_name" placeholder="Product name"></div>
          <div class="col-md-6">
            <select class="form-select mb-2" id="pf_category"><option value="">No category</option></select>
          </div>
        </div>
        <textarea class="form-control mb-2" id="pf_description" placeholder="Description" rows="3"></textarea>
        <div class="row g-2">
          <div class="col-md-4"><input type="number" step="0.01" class="form-control mb-2" id="pf_price" placeholder="Price"></div>
          <div class="col-md-4"><input type="number" step="0.01" class="form-control mb-2" id="pf_compareAt" placeholder="Compare-at price"></div>
          <div class="col-md-4"><input type="number" class="form-control mb-2" id="pf_stock" placeholder="Stock qty"></div>
        </div>
        <input class="form-control mb-2" id="pf_sku" placeholder="SKU (optional)">
        <label class="form-label small text-dim">Product image</label>
        <input type="file" class="form-control mb-2" id="pf_imageFile" accept="image/*">
        <input class="form-control mb-2" id="pf_imageUrl" placeholder="Or paste an image URL">
        <div id="pf_error" class="text-danger small mb-2"></div>
        <button class="btn btn-gold w-100" onclick="Admin.saveProduct()">Save Product</button>
      </div>
    </div>
  </div>
</div>

<!-- CATEGORY FORM MODAL -->
<div class="modal fade" id="categoryFormModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header border-terminal">
        <h5 class="modal-title mono text-gold">CATEGORY</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="cf_id">
        <input class="form-control mb-2" id="cf_name" placeholder="Category name">
        <textarea class="form-control mb-2" id="cf_description" placeholder="Description" rows="2"></textarea>
        <div id="cf_error" class="text-danger small mb-2"></div>
        <button class="btn btn-gold w-100" onclick="Admin.saveCategory()">Save Category</button>
      </div>
    </div>
  </div>
</div>

<!-- COUPON FORM MODAL -->
<div class="modal fade" id="couponFormModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header border-terminal">
        <h5 class="modal-title mono text-gold">COUPON</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input class="form-control mb-2" id="cpf_code" placeholder="Coupon code (e.g. SAVE10)">
        <select class="form-select mb-2" id="cpf_type">
          <option value="percent">Percent off</option>
          <option value="fixed">Fixed amount off</option>
        </select>
        <input type="number" step="0.01" class="form-control mb-2" id="cpf_value" placeholder="Value">
        <input type="number" step="0.01" class="form-control mb-2" id="cpf_minSubtotal" placeholder="Minimum subtotal (optional)">
        <input type="number" class="form-control mb-2" id="cpf_usageLimit" placeholder="Usage limit (optional)">
        <input type="date" class="form-control mb-2" id="cpf_expiresAt">
        <div id="cpf_error" class="text-danger small mb-2"></div>
        <button class="btn btn-gold w-100" onclick="Admin.saveCoupon()">Save Coupon</button>
      </div>
    </div>
  </div>
</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div id="mainToast" class="toast align-items-center text-bg-dark border-0" role="alert">
    <div class="d-flex">
      <div class="toast-body" id="toastBody">Message</div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="admin.js"></script>
</body>
</html>
